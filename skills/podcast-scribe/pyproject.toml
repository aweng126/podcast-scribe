[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-scribe"
version = "0.2.0"
description = "Speaker-aware podcast transcripts, document exports and a static reading site"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2026.8.19", "reportlab>=4.4", "imageio-ffmpeg>=0.6", "openai>=2.15"]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5", "pymupdf>=1.24"]

[project.scripts]
podcast-scribe = "podcast_scribe.cli:main"

[tool.setuptools.package-data]
podcast_scribe = ["assets/*"]

[tool.setuptools.packages.find]
include = ["podcast_scribe*"]
