name: Community validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate public records and build the reader
        run: python scripts/build_public_site.py --content-dir content/episodes --output-dir output/site
      - name: Install test dependencies
        run: python -m pip install -e './skills/podcast-scribe[test]'
      - name: Install the Chinese font used by PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
      - name: Run tests
        env:
          PODCAST_SCRIBE_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
        run: python -m pytest -q
      - name: Check browser scripts
        run: node --check skills/podcast-scribe/podcast_scribe/assets/app.js
