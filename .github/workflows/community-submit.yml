name: Community submission

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: community-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  submission:
    if: startsWith(github.event.issue.title, '[分享]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Privileged intake always uses maintained code; never check out a submission branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate and freeze the submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/community_submit.py
