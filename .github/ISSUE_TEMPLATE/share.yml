name: 分享文稿
description: 投稿已完成自动整理或精准校对，并确认可以公开分享的文稿。
title: "[分享] "
body:
  - type: markdown
    attributes:
      value: |
        将 Skill 提供的公开投稿 JSON 拖入下方“投稿 JSON”框，检查已预填的信息、补齐空项，勾选公开分享确认后提交。
        尚未取得投稿文件时，请先告诉 Skill：“愿意分享，署名为「我的名字」”。
        Issue 和附件上传后即公开；审核只决定是否收录到公共阅读站。
        首次有效投稿将固定为一份内容 PR。修改已固定的文稿请新建 Issue。
  - type: input
    id: source_url
    attributes:
      label: 来源链接
      description: 通常已由投稿链接填写；空白时从投稿 JSON 中复制来源链接。
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: 投稿署名
      description: 通常已由投稿链接填写；与生成文件时的署名一致，会公开展示。
    validations:
      required: true
  - type: input
    id: content_digest
    attributes:
      label: 内容 SHA-256
      description: 通常已由投稿链接填写；空白时复制 Skill 提供的 sha256，无需自行计算。
    validations:
      required: true
  - type: textarea
    id: attachment
    attributes:
      label: 投稿 JSON
      description: share 生成的 JSON 最大 512 MiB。25 MB 以内可拖入此处；更大文件请上传自己公开仓库的 Release，再粘贴唯一一个以 .json 结尾的资产下载链接。
    validations:
      required: true
  - type: checkboxes
    id: public_consent
    attributes:
      label: 公开分享确认
      options:
        - label: 我已检查投稿文件，确认可以公开分享，并同意在本项目及公共阅读站展示。
          required: true
